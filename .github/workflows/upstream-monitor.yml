name: Upstream Monitor

# Reports new FluffyChat commits as one issue. Never merges or pushes.
# Scheduled workflows in public repos are disabled after 60 days without
# repository activity: re-enable with `gh workflow enable upstream-monitor.yml`.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with upstream and update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_REPO: krille-chan/fluffychat
        run: bash .github/scripts/upstream-monitor.sh
