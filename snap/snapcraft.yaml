name: odango
title: Odango Matrix Messenger
base: core24
adopt-info: odango
license: AGPL-3.0
summary: An open-source Matrix messenger with a familiar look
description: |
  ## Your communication should be yours.

  Odango is an open-source Matrix messenger with a familiar, Telegram-style interface. End-to-end encrypted, decentralized, and easy to use for everyone.

  #### Secure

  Odango supports Matrix end-to-end encryption, encrypted message backups and device verification.

  #### Decentral

  Based on the open Matrix protocol, Odango works with any Matrix server and is compatible with other Matrix clients like Element, Nheko, Cinny or NeoChat. Learn more at matrix.org.

  #### A fork of FluffyChat

  Odango is a fork of FluffyChat and keeps its AGPL-3.0 licence and upstream attribution: https://github.com/krille-chan/fluffychat

  Website: https://odango.swovo.de
  Source: https://github.com/swovo/odango

grade: stable
confinement: strict

platforms:
  amd64:
    build-on: amd64
  arm64:
    build-on: arm64

parts:
  flutter-git:
    source: .
    plugin: nil
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      mkdir -p $CRAFT_PART_INSTALL/usr/libexec
      git clone --depth 1 --branch "$(jq -r .flutter .fvmrc)" https://github.com/flutter/flutter.git $CRAFT_PART_INSTALL/usr/libexec/flutter
      ln -s $CRAFT_PART_INSTALL/usr/libexec/flutter/bin/flutter $CRAFT_PART_INSTALL/usr/bin/flutter
      ln -s $CRAFT_PART_INSTALL/usr/libexec/flutter/bin/dart $SNAPCRAFT_PART_INSTALL/usr/bin/dart
      $CRAFT_PART_INSTALL/usr/bin/flutter doctor
    build-packages:
      - clang
      - cmake
      - curl
      - libgtk-3-dev
      - ninja-build
      - unzip
      - xz-utils
      - git
      - jq
      - zip
      - lld
      - llvm-18
    override-prime: ''

  odango:
    after: [flutter-git]
    plugin: nil
    source: .
    override-build: |
      craftctl set version="$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)"

      # Install rust manually:
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      export PATH="$HOME/.cargo/bin:$PATH"

      # Workaround for Flutter build error:
      rm -rf build

      flutter build linux --release -v
      mkdir -p $CRAFT_PART_INSTALL/bin/
      cp -r build/linux/*/release/bundle/* $CRAFT_PART_INSTALL/bin/
    build-packages:
      - libsecret-1-dev
      - libjsoncpp-dev
      - libssl-dev
      - curl
      - libpciaccess-dev
      - libpulse-dev
    stage-packages:
      - libsecret-1-0
      - libjsoncpp25
      - libpciaccess0
      - libpulse0
      - libmpv2
      - libblas3
      - liblapack3
    override-prime: | # Workaround for MediaKit:
      craftctl default
      for library_dir in "$CRAFT_PRIME"/usr/lib/*-linux-gnu; do
        if [ -e "$library_dir/libmpv.so.2" ]; then
          ln -sf "$(basename "$library_dir")/libmpv.so.2" "$CRAFT_PRIME/usr/lib/libmpv.so.2"
        fi
        ln -sf blas/libblas.so.3 "$library_dir/libblas.so.3"
        ln -sf lapack/liblapack.so.3 "$library_dir/liblapack.so.3"
      done

slots:
  dbus-svc:
    interface: dbus
    bus: session
    name: com.swovo.odango

apps:
  odango:
    command: bin/odango
    extensions: [ gnome ]
    plugs:
      - desktop
      - desktop-legacy
      - home
      - network
      - network-manager
      - opengl
      - removable-media
      - browser-support
      - password-manager-service
      - camera
      - audio-record
      - audio-playback
    slots:
      - dbus-svc
    environment:
      LIBMPV_LIBRARY_PATH: $SNAP/usr/lib/libmpv.so.2 # Otherwise app does not find libmp3
