version = 1

[[annotations]]
path = [
    ".mailmap",
    ".fvmrc",
    "pubspec.lock",
    "*.json",
    ".vscode/**",
    "lib/l10n/**",
    "assets/vodozemac/**",
    ".github/**",
    ".gitignore",
    ".metadata",
    "android/**",
    "ios/**",
    "linux/**",
    "macos/**",
    "integration_test/.gitignore",
    "integration_test/data/**",
    "integration_test/synapse/**",
    "snap/**",
    "windows/**",
    "web/**",
    "test/metadata/**",
    "test/goldens/**",
    "test/data/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2019-Present Christian Kußowski",
    "2026-Present Odango contributors"
]
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
    "assets/sounds/**"
]
SPDX-FileCopyrightText = "Pixabay"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
    "assets/sas-emoji.json"
]
SPDX-FileCopyrightText = "Matrix Foundation"
SPDX-License-Identifier = "Apache-2.0"

# Odango app logo and generated icons (placeholder licence until the owner decides)
[[annotations]]
path = [
    "assets/logo/*/logo**",
    "android/app/src/main/res/mipmap**/**",
    "android/app/src/main/res/drawable*/*.png",
    "android/fastlane/metadata/android/en-US/images/logo.png",
    "ios/Runner/Assets.xcassets/AppIcon.appiconset/**",
    "macos/Runner/Assets.xcassets/AppIcon.appiconset/**",
    "web/icons/**",
    "web/favicon.png",
    "snap/gui/*.png",
    "windows/runner/resources/app_icon.ico",
]
precedence = "override"
SPDX-FileCopyrightText = "2026-Present Odango contributors"
SPDX-License-Identifier = "LicenseRef-All-Rights-Reserved"

# Fonts
[[annotations]]
path = [
    "assets/fonts/Figtree-*",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 The Figtree Project Authors (https://github.com/erikdkennedy/figtree)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "assets/fonts/JetBrainsMono-*",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "assets/fonts/SOURCES.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2019-Present Christian Kußowski",
    "2026-Present Odango contributors"
]
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
    "third_party/receive_sharing_intent/**"
]
precedence = "override"
SPDX-FileCopyrightText = [
    "receive_sharing_intent contributors",
    "2026 Contributors to FluffyChat"
]
SPDX-License-Identifier = "Apache-2.0"
